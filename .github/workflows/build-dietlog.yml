name: Build DietLog APK

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "apps/DietLog/**"
      - ".github/workflows/build-dietlog.yml"
  push:
    branches: [ "main" ]
    paths:
      - "apps/DietLog/**"
      - ".github/workflows/build-dietlog.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/DietLog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint, unit test, and build debug APK
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dietlog-debug
          path: apps/DietLog/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
