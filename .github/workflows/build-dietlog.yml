name: Build DietLog APK

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "apps/DietLog/**"
      - ".github/workflows/build-dietlog.yml"
  push:
    branches: [ "main" ]
    paths:
      - "apps/DietLog/**"
      - ".github/workflows/build-dietlog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIETLOG_SUPABASE_URL: ${{ vars.DIETLOG_SUPABASE_URL }}
      DIETLOG_SUPABASE_PUBLISHABLE_KEY: ${{ vars.DIETLOG_SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: apps/DietLog
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare stable DietLog signing key
        env:
          DIETLOG_ANDROID_SIGNING_JSON: ${{ secrets.DIETLOG_ANDROID_SIGNING_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("DIETLOG_ANDROID_SIGNING_JSON", "").strip()
          if not raw:
              raise SystemExit("Missing required GitHub Actions secret DIETLOG_ANDROID_SIGNING_JSON")
          try:
              source = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit("DIETLOG_ANDROID_SIGNING_JSON is not valid JSON") from exc

          required = ("keystore_b64", "store_password", "key_alias", "key_password", "certificate_sha1")
          missing = [key for key in required if not source.get(key)]
          if missing:
              raise SystemExit("DIETLOG_ANDROID_SIGNING_JSON is missing required signing fields")

          try:
              keystore_bytes = base64.b64decode(source["keystore_b64"], validate=True)
          except Exception as exc:
              raise SystemExit("DIETLOG_ANDROID_SIGNING_JSON contains an invalid keystore payload") from exc
          if len(keystore_bytes) < 512:
              raise SystemExit("DietLog signing keystore payload is unexpectedly small")

          signing_dir = Path(os.environ["RUNNER_TEMP"]) / "dietlog-signing"
          signing_dir.mkdir(parents=True, exist_ok=True)
          keystore_path = signing_dir / "dietlog-ci-debug-signing.p12"
          config_path = signing_dir / "gradle-signing.json"
          keystore_path.write_bytes(keystore_bytes)
          config_path.write_text(json.dumps({
              "storeFile": str(keystore_path),
              "storePassword": source["store_password"],
              "keyAlias": source["key_alias"],
              "keyPassword": source["key_password"],
          }), encoding="utf-8")
          os.chmod(keystore_path, 0o600)
          os.chmod(config_path, 0o600)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"DIETLOG_SIGNING_CONFIG={config_path}\n")
              env_file.write(f"DIETLOG_EXPECTED_SIGNING_SHA1={source['certificate_sha1']}\n")
          print("Stable DietLog signing material prepared.")
          PY
      - name: Check optional Supabase build configuration
        shell: bash
        run: |
          if [[ -n "$DIETLOG_SUPABASE_URL" && -n "$DIETLOG_SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "Supabase cloud sync configuration is present."
          else
            echo "Supabase cloud sync configuration is not set; this APK will keep Supabase disabled while local and Google Drive features remain available."
          fi
      - name: Prepare offline food database dependencies
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5 Pillow==12.3.0
          mkdir -p .dataset-cache app/src/main/assets
          curl -fL --retry 3 -o .dataset-cache/off-india.csv https://raw.githubusercontent.com/mvark/indiafoodstats/71ff743f61edb0eee553e4ea1c9ce86ea427f0d9/data/india_products_18613.csv
          curl -fL --retry 3 -o .dataset-cache/openlabel-india.ts https://raw.githubusercontent.com/armaanux/openlabel/af43c0596c50713debb68e7be5454c6723a0f4a0/src/data/off/off-india.data.ts
          curl -fL --retry 3 -o .dataset-cache/ifct.csv https://raw.githubusercontent.com/krishnabhat/indian-food-nutrition-mcp/94272b169f2c16cd45e53c97f096ce8a189af3db/data/ifct-compositions.csv
          curl -fL --retry 3 -o .dataset-cache/usda.csv https://raw.githubusercontent.com/krishnabhat/indian-food-nutrition-mcp/94272b169f2c16cd45e53c97f096ce8a189af3db/data/usda-foods.csv
          curl -fL --retry 3 -o .dataset-cache/indb.xlsx https://raw.githubusercontent.com/lindsayjaacks/Indian-Nutrient-Databank-INDB-/fbdb62bec519c6e2468582a799fb47e194b42558/INDB.xlsx
      - name: Test and build offline catalogue
        run: |
          python -m unittest tools.test_builder tools.test_photos -v
          python tools/build_food_db.py \
            --off .dataset-cache/off-india.csv \
            --openlabel .dataset-cache/openlabel-india.ts \
            --ifct .dataset-cache/ifct.csv \
            --usda .dataset-cache/usda.csv \
            --indb .dataset-cache/indb.xlsx \
            --output app/src/main/assets/offline_foods.db
          python tools/validate_food_db.py app/src/main/assets/offline_foods.db --min-foods 26000
          python -m unittest tools.test_planner_catalog -v
          python tools/validate_food_photos.py --food-db app/src/main/assets/offline_foods.db --assets app/src/main/assets
          ls -lh app/src/main/assets/offline_foods.db
      - name: Lint, unit test, and build debug APK
        run: gradle --no-daemon lintDebug testDebugUnitTest assembleDebug
      - name: Verify stable DietLog signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          test -f "$APK"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"
          APK_SHA1_RAW="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -n 1)"
          test -n "$APK_SHA1_RAW"
          NORMALIZED_APK_SHA1="$(printf '%s' "$APK_SHA1_RAW" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          NORMALIZED_EXPECTED_SHA1="$(printf '%s' "$DIETLOG_EXPECTED_SIGNING_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$NORMALIZED_APK_SHA1" != "$NORMALIZED_EXPECTED_SHA1" ]]; then
            echo "::error::DietLog APK signing certificate does not match the configured stable certificate."
            exit 1
          fi
          FORMATTED_SHA1="$(printf '%s' "$NORMALIZED_APK_SHA1" | sed 's/../&:/g; s/:$//')"
          echo "DietLog stable signing SHA-1: $FORMATTED_SHA1"
          echo "DIETLOG_SIGNING_SHA1=$FORMATTED_SHA1" >> "$GITHUB_ENV"
      - name: Prepare release APK and update metadata
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DietLog-debug.apk
          python tools/build_update_manifest.py --apk DietLog-debug.apk \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" --output dietlog-update.json
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dietlog-debug
          path: apps/DietLog/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish rolling DietLog release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f dietlog-latest "$GITHUB_SHA"
          git push origin refs/tags/dietlog-latest --force

          if gh release view dietlog-latest >/dev/null 2>&1; then
            gh release upload dietlog-latest DietLog-debug.apk dietlog-update.json --clobber
            gh release edit dietlog-latest \
              --title "DietLog Latest Debug" \
              --notes "Latest successful DietLog debug build from commit $GITHUB_SHA. Stable signing SHA-1: $DIETLOG_SIGNING_SHA1. The APK includes the bundled offline food database."
          else
            gh release create dietlog-latest DietLog-debug.apk dietlog-update.json \
              --title "DietLog Latest Debug" \
              --notes "Latest successful DietLog debug build from commit $GITHUB_SHA. Stable signing SHA-1: $DIETLOG_SIGNING_SHA1. The APK includes the bundled offline food database."
          fi
