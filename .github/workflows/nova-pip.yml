name: Nova PiP APK

on:
  push:
    branches: [ "nova-pip-build" ]
    paths:
      - ".github/workflows/nova-pip.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Configure NDK environment
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install build packages
        run: |
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build maven build-essential wget curl unzip git pkg-config

      - name: Install repo tool
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo | sudo tee /usr/local/bin/repo >/dev/null
          sudo chmod a+x /usr/local/bin/repo

      - name: Retrieve latest Nova upstream
        run: |
          mkdir nova
          cd nova
          repo init -u https://github.com/nova-video-player/aos-AVP -b nova -m v6_4.xml
          repo sync -j 4
          repo forall -c 'git checkout -t $REPO_REMOTE/$REPO_RREV || git checkout $REPO_RREV'
          echo "AVP revision:"
          git -C AVP log -1 --oneline
          echo "Video revision:"
          git -C Video log -1 --oneline

      - name: Add handheld native Picture-in-Picture
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("nova/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java")
          source = path.read_text(encoding="utf-8")

          marker = "\n    @Override\n    protected void onResume() {"

          if "enterHandheldPictureInPicture()" in source:
              raise SystemExit("Handheld PiP patch already present upstream; refusing to duplicate it.")

          block = r'''
              @androidx.annotation.RequiresApi(Build.VERSION_CODES.O)
              private boolean canEnterHandheldPictureInPicture() {
                  return Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                          && !TVUtils.isTV(this)
                          && !isFinishing()
                          && !isDestroyed()
                          && mPlayer != null
                          && mPlayer.isPlaying()
                          && getPackageManager().hasSystemFeature(PackageManager.FEATURE_PICTURE_IN_PICTURE)
                          && !isInPictureInPictureMode();
              }

              @androidx.annotation.RequiresApi(Build.VERSION_CODES.O)
              private void enterHandheldPictureInPicture() {
                  if (!canEnterHandheldPictureInPicture()) {
                      return;
                  }

                  try {
                      PictureInPictureParams.Builder builder = new PictureInPictureParams.Builder();

                      int videoWidth = mPlayer.getVideoWidth();
                      int videoHeight = mPlayer.getVideoHeight();
                      if (videoWidth > 0 && videoHeight > 0) {
                          double ratio = (double) videoWidth / videoHeight;
                          if (ratio >= 1.0 / 2.39 && ratio <= 2.39) {
                              builder.setAspectRatio(new Rational(videoWidth, videoHeight));
                          }
                      }

                      View targetView = (mSurfaceController != null && mSurfaceController.getView() != null)
                              ? mSurfaceController.getView() : mRootView;
                      if (targetView != null) {
                          Rect sourceRectHint = new Rect();
                          targetView.getGlobalVisibleRect(sourceRectHint);
                          builder.setSourceRectHint(sourceRectHint);
                      }

                      if (mPlayerController != null) {
                          mPlayerController.hide();
                      }
                      enterPictureInPictureMode(builder.build());
                  } catch (IllegalArgumentException | IllegalStateException e) {
                      log.warn("Unable to enter handheld picture-in-picture", e);
                  }
              }

              @Override
              protected void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      enterHandheldPictureInPicture();
                  }
              }
          '''

          if marker not in source:
              raise SystemExit("Could not find onResume insertion point in PlayerActivity.java")

          source = source.replace(marker, "\n" + block + marker, 1)
          path.write_text(source, encoding="utf-8")
          PY

          grep -n -A55 -B5 "canEnterHandheldPictureInPicture" nova/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java

      - name: Build signed universal debug APK
        run: |
          cd nova/Video
          ./gradlew --no-daemon -Puniversal assembleNoamazonDebug

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          find nova/Video/build/outputs/apk -type f -name "*.apk" -print
          APK="$(find nova/Video/build/outputs/apk -type f -name "*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" artifacts/Nova-PiP-latest-upstream.apk
          sha256sum artifacts/Nova-PiP-latest-upstream.apk | tee artifacts/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-pip-latest-upstream
          path: |
            artifacts/Nova-PiP-latest-upstream.apk
            artifacts/SHA256.txt
          if-no-files-found: error
          retention-days: 14
